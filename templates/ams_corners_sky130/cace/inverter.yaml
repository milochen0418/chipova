#--------------------------------------------------------------
# CACE circuit characterization file (CACE 2.11, datasheet format 5.2)
# A CMOS inverter in SkyWater SKY130, characterized across process
# corners, supply voltage and temperature.
#--------------------------------------------------------------

name:           inverter
description:    CMOS inverter (sky130_fd_pr 1.8 V devices, Wp/Wn = 2/1 um, L = 0.15 um)
PDK:            sky130A

cace_format:    5.2

authorship:
  designer:         Chipova template
  creation_date:    October 26, 2026
  license:          Apache 2.0

paths:
  root:             ..
  schematic:        xschem
  netlist:          netlist
  documentation:    docs
  # defaults: templates cace/templates, scripts cace/scripts, runs runs

pins:
  VDD:
    description: Positive supply
    type: power
    direction: inout
    Vmin: 1.62
    Vmax: 1.98
  VSS:
    description: Ground
    type: ground
    direction: inout
  IN:
    description: Input
    type: signal
    direction: input
  OUT:
    description: Output
    type: signal
    direction: output

default_conditions:
  vdd:
    description: Supply voltage
    display: VDD
    unit: V
    typical: 1.8
  corner:
    description: Process corner
    display: Corner
    typical: tt
  temperature:
    description: Ambient temperature
    display: Temp
    unit: °C
    typical: 27
  cload:
    description: Output load capacitance
    display: CLoad
    unit: fF
    typical: 20
  tslew:
    description: Input rise and fall time (0 to 100 %)
    display: Input slew
    unit: ps
    typical: 50

parameters:
  tpd:
    display: Propagation delay
    description: Input-to-output delay at VDD/2 with CLoad on the output
    spec:
      tpd_hl:
        display: Delay, output falling
        description: From the input rising through VDD/2 to the output falling through VDD/2
        unit: ps
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 200
      tpd_lh:
        display: Delay, output rising
        description: From the input falling through VDD/2 to the output rising through VDD/2
        unit: ps
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 250
    tool:
      ngspice:
        template: tb_delay.sch
        format: ascii
        suffix: .data
        variables: [tpd_hl, tpd_lh]
    # CACE plots the raw simulator values (seconds): label the axes in seconds.
    variables:
      tpd_hl:
        display: tpd_hl
        unit: s
      tpd_lh:
        display: tpd_lh
        unit: s
    plot:
      tpd_hl_vs_corner:
        type: xyplot
        xaxis: corner
        yaxis: tpd_hl
        limits: false
      tpd_lh_vs_corner:
        type: xyplot
        xaxis: corner
        yaxis: tpd_lh
        limits: false
      tpd_hl_vs_temp:
        type: xyplot
        xaxis: temperature
        yaxis: tpd_hl
        limits: false
      tpd_lh_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: tpd_lh
        limits: false
    conditions:
      corner:
        enumerate: [ss, sf, tt, fs, ff]
      vdd:
        minimum: 1.62
        typical: 1.8
        maximum: 1.98
      temperature:
        minimum: -40
        typical: 27
        maximum: 125

  vtc:
    display: DC transfer
    description: Switching threshold and noise margins from the DC transfer curve
    spec:
      vm:
        display: Switching threshold VM
        description: Input voltage where the output equals the input
        unit: V
        minimum:
          value: 0.6
        typical:
          value: any
        maximum:
          value: 1.1
      nml:
        display: Noise margin low
        description: VIL - VOL, from the points where dVout/dVin = -1
        unit: V
        minimum:
          value: 0.5
        typical:
          value: any
        maximum:
          value: any
      nmh:
        display: Noise margin high
        description: VOH - VIH, from the points where dVout/dVin = -1
        unit: V
        minimum:
          value: 0.5
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: tb_vtc.sch
        format: ascii
        suffix: .data
        variables: [vm, nml, nmh]
    plot:
      vm_vs_corner:
        type: xyplot
        xaxis: corner
        yaxis: vm
        limits: true
      vm_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: vm
        limits: true
      nml_vs_temp:
        type: xyplot
        xaxis: temperature
        yaxis: nml
        limits: true
    conditions:
      corner:
        enumerate: [ss, sf, tt, fs, ff]
      vdd:
        minimum: 1.62
        typical: 1.8
        maximum: 1.98
      temperature:
        minimum: -40
        typical: 27
        maximum: 125

  vtc_curve:
    display: DC transfer curves
    description: Vout against Vin at each process corner (VDD 1.8 V, 27 °C), for the plot
    tool:
      ngspice:
        template: tb_vtc_curve.sch
        format: ascii
        suffix: .data
        variables: [vin, vout]
    variables:
      vin:
        display: Vin
        unit: V
      vout:
        display: Vout
        unit: V
    plot:
      vtc:
        type: xyplot
        xaxis: vin
        yaxis: vout
    conditions:
      corner:
        enumerate: [ss, sf, tt, fs, ff]

  waveform:
    display: Transient waveforms
    description: Vout against time at each process corner (VDD 1.8 V, 27 °C), for the plot
    tool:
      ngspice:
        template: tb_wave.sch
        format: ascii
        suffix: .data
        variables: [null, time_ns, vin, vout]
    variables:
      time_ns:
        display: Time
        unit: ns
      vin:
        display: Vin
        unit: V
      vout:
        display: Vout
        unit: V
    plot:
      waveform:
        type: xyplot
        xaxis: time_ns
        yaxis: vout
    conditions:
      corner:
        enumerate: [ss, sf, tt, fs, ff]
