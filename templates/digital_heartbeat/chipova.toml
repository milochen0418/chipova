# Chipova project settings: what the runs use. Change them in the project's Settings,
# or here (every snapshot keeps this file with the sources).

[design]
top = "heartbeat"
rtl = ["rtl/heartbeat.v"]
sdc = "constraints/heartbeat.sdc"
clock_port = "clk"
