[tool.poetry]
name = "chipova"
version = "0.1.0"
description = "Chipova - an agentic IC design studio: people and AI agents design chips together, from RTL to GDSII"
authors = ["Milo Chen"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
# Developed on 3.11 (see AGENTS.md), the Python of the re_ddns App Store image (python:3.11);
# capped below 3.15 because klayout (the layout pictures) publishes wheels only up to 3.14.
python = ">=3.11,<3.15"
reflex = "0.10.0"
reflex-monaco = "*"
# The co-edited source files, held by the server too (for approved AI patches and snapshots).
pycrdt = ">=0.14"
# EDA runs are containers started through the Docker socket.
docker = ">=7.1.0"
# Pictures of layouts (GDS) at any zoom, drawn in a worker process.
klayout = "0.30.12"
pydantic = ">=2.7"
reflex-ddns-auth = {path = "../reflex_ddns_auth", develop = true}
PyJWT = ">=2.8"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "playwright (>=1.50,<2.0)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "docker: needs a Docker daemon and the chipova EDA images (skipped without them)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
